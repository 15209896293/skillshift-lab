/* ============================================================
   SkillShift Studio — Design System (R0.5)
   Brand: SkillShift
   Tone: Professional, restrained, trustworthy tool
   ============================================================ */

:root {
  /* ---------- Brand Primary (Teal / Deep Emerald) ---------- */
  --color-primary-50:  #effaf7;
  --color-primary-100: #d9f2ec;
  --color-primary-200: #b5e4d9;
  --color-primary-300: #84cfbe;
  --color-primary-400: #4fb39d;
  --color-primary-500: #2e9782;  /* core brand */
  --color-primary-600: #1f7a68;
  --color-primary-700: #1b6256;
  --color-primary-800: #194f46;
  --color-primary-900: #17423b;
  --color-primary-950: #082723;

  /* ---------- Neutral (Warm slate) ---------- */
  --color-neutral-50:  #f8f9fa;
  --color-neutral-100: #f1f3f5;
  --color-neutral-200: #e5e8eb;
  --color-neutral-300: #d0d5da;
  --color-neutral-400: #aab2bb;
  --color-neutral-500: #808a96;
  --color-neutral-600: #606a75;
  --color-neutral-700: #49505a;
  --color-neutral-800: #32383f;
  --color-neutral-900: #1f2328;
  --color-neutral-950: #111418;

  /* ---------- Semantic State Colors ---------- */
  --state-success:  #10b981;
  --state-success-bg: #ecfdf5;
  --state-success-border: #a7f3d0;
  --state-warning:  #f59e0b;
  --state-warning-bg: #fffbeb;
  --state-warning-border: #fde68a;
  --state-error:    #ef4444;
  --state-error-bg:   #fef2f2;
  --state-error-border: #fecaca;
  --state-info:     #3b82f6;
  --state-info-bg:    #eff6ff;
  --state-info-border: #bfdbfe;

  /* ---------- Simulation / Mock Banner ---------- */
  --state-simulation: #8b5cf6;
  --state-simulation-bg: #f5f3ff;
  --state-simulation-border: #ddd6fe;

  /* ---------- Radius Scale ---------- */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-full: 9999px;

  /* ---------- Typography ---------- */
  --font-sans: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont,
               "Segoe UI", "Microsoft YaHei", "微软雅黑", "PingFang SC",
               "Hiragino Sans GB", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Menlo", "Consolas",
               "Liberation Mono", "Courier New", monospace;

  --text-xs:  11px;
  --text-sm:  13px;
  --text-base: 14px;
  --text-lg:  16px;
  --text-xl:  18px;
  --text-2xl: 22px;
  --text-3xl: 28px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  --tracking-tight: -0.01em;
  --tracking-normal: 0;

  /* ---------- Spacing (4px base) ---------- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* ---------- Shadow (restrained, border-led) ---------- */
  --shadow-sm: 0 1px 2px rgba(17, 20, 24, 0.04);
  --shadow-md: 0 2px 8px rgba(17, 20, 24, 0.05);
  --shadow-lg: 0 8px 24px rgba(17, 20, 24, 0.08);
  --shadow-pop: 0 12px 40px rgba(17, 20, 24, 0.12);

  /* ---------- Semantic Aliases (light mode) ---------- */
  --ss-background: var(--color-neutral-50);
  --ss-foreground: var(--color-neutral-900);
  --ss-card: #ffffff;
  --ss-card-foreground: var(--color-neutral-900);
  --ss-popover: #ffffff;
  --ss-popover-foreground: var(--color-neutral-900);
  --ss-primary: var(--color-primary-600);
  --ss-primary-foreground: #ffffff;
  --ss-primary-hover: var(--color-primary-700);
  --ss-primary-active: var(--color-primary-800);
  --ss-muted: var(--color-neutral-100);
  --ss-muted-foreground: var(--color-neutral-500);
  --ss-border: var(--color-neutral-200);
  --ss-input: var(--color-neutral-200);
  --ss-ring: var(--color-primary-500);
  --ss-accent: var(--color-primary-50);
  --ss-accent-foreground: var(--color-primary-700);
  --ss-destructive: var(--state-error);
  --ss-destructive-foreground: #ffffff;
  --ss-sidebar: #ffffff;
  --ss-sidebar-foreground: var(--color-neutral-900);
  --ss-sidebar-border: var(--color-neutral-200);
  --ss-code-bg: #f6f8fa;

  --ss-radius-sm: var(--radius-sm);
  --ss-radius-md: var(--radius-md);
  --ss-radius-lg: var(--radius-lg);

  /* ---------- Status Pill Colors ---------- */
  --ss-status-draft-bg: var(--color-neutral-100);
  --ss-status-draft-fg: var(--color-neutral-600);
  --ss-status-published-bg: var(--color-primary-50);
  --ss-status-published-fg: var(--color-primary-700);
  --ss-status-in-progress-bg: #fff7ed;
  --ss-status-in-progress-fg: #c2410c;
  --ss-status-submitted-bg: var(--state-info-bg);
  --ss-status-submitted-fg: var(--state-info);
  --ss-status-reviewed-bg: var(--state-success-bg);
  --ss-status-reviewed-fg: var(--state-success);
  --ss-status-revision-bg: var(--state-warning-bg);
  --ss-status-revision-fg: var(--state-warning);
  --ss-status-closed-bg: var(--color-neutral-100);
  --ss-status-closed-fg: var(--color-neutral-500);
}

/* Dark mode tokens (preserved for future) */
@media (prefers-color-scheme: dark) {
  :root {
    --ss-background: var(--color-neutral-950);
    --ss-foreground: var(--color-neutral-50);
    --ss-card: var(--color-neutral-900);
    --ss-card-foreground: var(--color-neutral-50);
    --ss-popover: var(--color-neutral-900);
    --ss-popover-foreground: var(--color-neutral-50);
    --ss-primary: var(--color-primary-400);
    --ss-primary-foreground: var(--color-neutral-950);
    --ss-muted: var(--color-neutral-800);
    --ss-muted-foreground: var(--color-neutral-400);
    --ss-border: var(--color-neutral-800);
    --ss-input: var(--color-neutral-800);
    --ss-ring: var(--color-primary-400);
    --ss-accent: var(--color-primary-900);
    --ss-accent-foreground: var(--color-primary-100);
    --ss-sidebar: var(--color-neutral-900);
    --ss-sidebar-foreground: var(--color-neutral-50);
    --ss-sidebar-border: var(--color-neutral-800);
  }
}

/* ============================================================
   Base / Reset
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  color: var(--ss-foreground);
  background: var(--ss-background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "cv11", "ss01";
}

code, pre, kbd, samp {
  font-family: var(--font-mono);
  font-size: 0.9em;
}

/* ============================================================
   Utility Classes
   ============================================================ */
.ss-text-muted { color: var(--ss-muted-foreground); }
.ss-text-primary { color: var(--ss-primary); }
.ss-text-error { color: var(--state-error); }
.ss-text-success { color: var(--state-success); }
.ss-text-warning { color: var(--state-warning); }

.ss-bg-card { background: var(--ss-card); }
.ss-bg-muted { background: var(--ss-muted); }
.ss-bg-accent { background: var(--ss-accent); }

.ss-border { border: 1px solid var(--ss-border); }
.ss-border-b { border-bottom: 1px solid var(--ss-border); }
.ss-border-t { border-top: 1px solid var(--ss-border); }

.ss-rounded-sm { border-radius: var(--ss-radius-sm); }
.ss-rounded-md { border-radius: var(--ss-radius-md); }
.ss-rounded-lg { border-radius: var(--ss-radius-lg); }
.ss-rounded-full { border-radius: var(--radius-full); }

.ss-shadow-sm { box-shadow: var(--shadow-sm); }
.ss-shadow-md { box-shadow: var(--shadow-md); }

/* Status pill */
.ss-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  font-size: var(--text-xs);
  font-weight: 500;
  line-height: 1.6;
  border-radius: var(--radius-full);
  white-space: nowrap;
}
.ss-pill::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}
.ss-pill-draft { background: var(--ss-status-draft-bg); color: var(--ss-status-draft-fg); }
.ss-pill-published { background: var(--ss-status-published-bg); color: var(--ss-status-published-fg); }
.ss-pill-in-progress { background: var(--ss-status-in-progress-bg); color: var(--ss-status-in-progress-fg); }
.ss-pill-submitted { background: var(--ss-status-submitted-bg); color: var(--ss-status-submitted-fg); }
.ss-pill-reviewed { background: var(--ss-status-reviewed-bg); color: var(--ss-status-reviewed-fg); }
.ss-pill-revision { background: var(--ss-status-revision-bg); color: var(--ss-status-revision-fg); }
.ss-pill-closed { background: var(--ss-status-closed-bg); color: var(--ss-status-closed-fg); }
.ss-pill-simulation { background: var(--state-simulation-bg); color: var(--state-simulation); }

/* Button base */
.ss-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 16px;
  font-size: var(--text-sm);
  font-weight: 500;
  font-family: inherit;
  line-height: 1.4;
  border-radius: var(--ss-radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  white-space: nowrap;
  user-select: none;
}
.ss-btn-primary {
  background: var(--ss-primary);
  color: var(--ss-primary-foreground);
}
.ss-btn-primary:hover { background: var(--ss-primary-hover); }
.ss-btn-primary:active { background: var(--ss-primary-active); }

.ss-btn-secondary {
  background: var(--ss-card);
  color: var(--ss-foreground);
  border-color: var(--ss-border);
}
.ss-btn-secondary:hover { background: var(--ss-muted); }

.ss-btn-ghost {
  background: transparent;
  color: var(--ss-foreground);
}
.ss-btn-ghost:hover { background: var(--ss-muted); }

.ss-btn-sm {
  padding: 5px 12px;
  font-size: var(--text-xs);
}
.ss-btn-lg {
  padding: 10px 20px;
  font-size: var(--text-base);
}

.ss-btn-icon {
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: var(--ss-radius-md);
}

/* Simulation banner */
.ss-simulation-banner {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: var(--state-simulation-bg);
  border-bottom: 1px solid var(--state-simulation-border);
  color: var(--state-simulation);
  font-size: var(--text-xs);
  font-weight: 500;
}
.ss-simulation-banner svg { flex-shrink: 0; }

/* Card */
.ss-card {
  background: var(--ss-card);
  border: 1px solid var(--ss-border);
  border-radius: var(--ss-radius-lg);
  box-shadow: var(--shadow-sm);
}
.ss-card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--ss-border);
}
.ss-card-body {
  padding: 20px;
}
.ss-card-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--ss-border);
  background: var(--color-neutral-50);
  border-radius: 0 0 var(--ss-radius-lg) var(--ss-radius-lg);
}

/* Sidebar nav item */
.ss-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  font-size: var(--text-sm);
  color: var(--ss-muted-foreground);
  border-radius: var(--ss-radius-md);
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.ss-nav-item:hover {
  background: var(--ss-muted);
  color: var(--ss-foreground);
}
.ss-nav-item.active {
  background: var(--ss-accent);
  color: var(--ss-accent-foreground);
  font-weight: 500;
}
.ss-nav-item svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

/* Progress bar */
.ss-progress {
  height: 6px;
  background: var(--ss-muted);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.ss-progress-bar {
  height: 100%;
  background: var(--ss-primary);
  border-radius: var(--radius-full);
  transition: width 0.3s ease;
}

/* Input */
.ss-input {
  width: 100%;
  padding: 8px 12px;
  font-size: var(--text-sm);
  font-family: inherit;
  color: var(--ss-foreground);
  background: var(--ss-card);
  border: 1px solid var(--ss-input);
  border-radius: var(--ss-radius-md);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.ss-input:focus {
  outline: none;
  border-color: var(--ss-ring);
  box-shadow: 0 0 0 3px rgba(46, 151, 130, 0.12);
}
.ss-input::placeholder {
  color: var(--color-neutral-400);
}

/* Badge count */
.ss-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  font-size: 10px;
  font-weight: 600;
  line-height: 1;
  border-radius: var(--radius-full);
  background: var(--color-neutral-200);
  color: var(--color-neutral-700);
}
.ss-badge-primary {
  background: var(--ss-primary);
  color: var(--ss-primary-foreground);
}

/* Divider */
.ss-divider {
  height: 1px;
  background: var(--ss-border);
  margin: 16px 0;
}

/* Table */
.ss-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-sm);
}
.ss-table th {
  text-align: left;
  font-weight: 500;
  color: var(--ss-muted-foreground);
  padding: 10px 12px;
  border-bottom: 1px solid var(--ss-border);
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.ss-table td {
  padding: 12px;
  border-bottom: 1px solid var(--ss-border);
  vertical-align: middle;
}
.ss-table tr:last-child td { border-bottom: none; }
.ss-table tr:hover td { background: var(--color-neutral-50); }

/* Tag */
.ss-tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  font-size: var(--text-xs);
  background: var(--ss-muted);
  color: var(--color-neutral-700);
  border-radius: var(--ss-radius-sm);
  border: 1px solid var(--ss-border);
}
